<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Bashmak</title>
    <!-- Lock orientation to landscape on mobile -->
    <script>
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    </script>
    <!-- Google Fonts: Underdog & Balsamiq Sans with Cyrillic support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@700&family=Underdog&display=swap" rel="stylesheet" />
    <!-- Telegram Mini App SDK (безопасно подключается в head, если не в Telegram — не мешает) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- Rotate device overlay (portrait only) -->
    <div id="rotate-overlay" style="
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0e14;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: sans-serif;
      font-size: 22px;
      text-align: center;
      gap: 20px;
    ">
      <div style="font-size: 60px; animation: spin 2s linear infinite;">📱</div>
      <div>Поверни телефон горизонтально!</div>
      <style>
        @keyframes spin {
          0%, 100% { transform: rotate(0deg); }
          25% { transform: rotate(-90deg); }
          75% { transform: rotate(-90deg); }
        }
      </style>
    </div>
    <!-- Font Preload Trigger for Phaser Canvas (Forces browser to fetch local font files before Canvas renders) -->
    <div style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
      <span style="font-family: 'Boingster';">ВЫБОР МУТАНТА 0123456789</span>
      <span style="font-family: 'NarisovanniySANS';">Слизистый след 0123456789</span>
      <span style="font-family: 'Gagalin';">ВЫБРАТЬ SELECT 0123456789</span>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      function checkOrientation() {
        const overlay = document.getElementById('rotate-overlay');
        const isPortrait = window.innerHeight > window.innerWidth;
        overlay.style.display = isPortrait ? 'flex' : 'none';
      }
      checkOrientation();
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
    </script>
  </body>
</html>
